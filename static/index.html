<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Pointless-T</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #181a20;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        .main-flex-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            min-height: 80vh;
        }
        .history-tab {
            width: 260px;
            height: 80vh;
            background: #23242b;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            box-shadow: 2px 0 12px #0006;
            padding: 16px 16px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            border-right: 2px solid #181a20;
        }
        .history-header {
            font-weight: bold;
            color: #ffb300;
            margin-bottom: 8px;
            font-size: 1.13em;
            letter-spacing: 0.5px;
            text-align: left;
            border-bottom: 1.5px solid #444;
            padding-bottom: 6px;
        }
        .chatgpt-container {
            flex: 1;
            max-width: 600px;
            margin: 40px auto;
            background: #23242b;
            border-radius: 10px;
            box-shadow: 0 2px 16px #0008;
            padding: 0 0 16px 0;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        h1 {
            text-align: center;
            color: #ffb300;
            margin: 0;
            padding: 24px 0 8px 0;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .chat-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 1.08em;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 2px 8px #0002;
        }
        .user-bubble {
            align-self: flex-end;
            background: linear-gradient(90deg, #ffb300 0%, #ff6f00 100%);
            color: #181a20;
        }
        .bot-bubble {
            align-self: flex-start;
            background: #23242b;
            border: 1.5px solid #ffb300;
            color: #ffeb3b;
        }
        .chat-input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 16px 24px 0 24px;
            background: #23242b;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .chat-input-row textarea {
            flex: 1;
            min-height: 36px;
            max-height: 120px;
            resize: none;
            border-radius: 6px;
            border: 1px solid #333;
            background: #181a20;
            color: #e0e0e0;
            font-size: 1em;
            padding: 10px;
        }
        .chat-input-row button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(90deg, #ffb300 0%, #ff6f00 100%);
            color: #181a20;
            border: none;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
        }
        .chat-input-row button:hover {
            background: linear-gradient(90deg, #ff6f00 0%, #ffb300 100%);
            color: #fff;
        }
        .error {
            color: #ff5252;
            margin: 8px 0 0 24px;
        }
        .active-session {
            background: #333 !important;
            color: #ffb300 !important;
            border: 1.5px solid #ffb300 !important;
        }
    </style>
</head>
<body>
    <div id="main-app">
        <div class="main-flex-row">
            <div id="history-tab" class="history-tab">
                <div class="history-header">
                    <span>Sessions</span>
                    <button id="new-session-btn" title="New Chat" style="background:#23242b;color:#ffb300;border:none;font-size:1.3em;padding:0 8px;cursor:pointer;border-radius:6px;">＋</button>
                </div>
                <div id="history-list"></div>
            </div>
            <div class="chatgpt-container">
                <h1>G-Pointless-T</h1>
                <div id="chat-area" class="chat-area"></div>
                <form id="gpointlesst-form" class="chat-input-row">
                    <textarea id="input" required rows="1" placeholder="Type your message and hit Enter..."></textarea>
                    <button type="submit" title="Send">➤</button>
                </form>
                <div id="error" class="error"></div>
            </div>
        </div>
    </div>

    <script>
        // ---- Session Data ----
        let sessions = [];
        let activeSessionId = null;

        function saveSessions() {
            localStorage.setItem('gpt_sessions', JSON.stringify(sessions));
            localStorage.setItem('gpt_activeSessionId', activeSessionId);
        }
        function loadSessions() {
            try {
                sessions = JSON.parse(localStorage.getItem('gpt_sessions')) || [];
                activeSessionId = localStorage.getItem('gpt_activeSessionId') || (sessions[0] && sessions[0].id) || null;
            } catch {
                sessions = [];
                activeSessionId = null;
            }
        }
        function createSession(title = 'New Chat') {
            const id = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
            const session = { id, title, history: [] };
            sessions.unshift(session);
            activeSessionId = id;
            saveSessions();
            return session;
        }
        function getActiveSession() {
            return sessions.find(s => s.id === activeSessionId);
        }
        function deleteSession(id) {
            sessions = sessions.filter(s => s.id !== id);
            if (activeSessionId === id) activeSessionId = sessions[0]?.id || null;
            saveSessions();
        }

        // ---- Chat Logic ----
        function setupChat() {
            const form = document.getElementById('gpointlesst-form');
            const chatArea = document.getElementById('chat-area');
            const errorDiv = document.getElementById('error');
            const inputBox = document.getElementById('input');
            const historyList = document.getElementById('history-list');
            const newSessionBtn = document.getElementById('new-session-btn');

            function addBubble(text, isUser) {
                const bubble = document.createElement('div');
                bubble.className = 'chat-bubble ' + (isUser ? 'user-bubble' : 'bot-bubble');
                bubble.textContent = text;
                chatArea.appendChild(bubble);
                chatArea.scrollTop = chatArea.scrollHeight;
            }

            function renderChat() {
                chatArea.innerHTML = '';
                const session = getActiveSession();
                if (!session || !session.history.length) return;
                session.history.forEach(item => {
                    addBubble(item.user, true);
                    addBubble(item.bot, false);
                });
            }

            function updateHistory() {
                historyList.innerHTML = '';
                if (!sessions.length) {
                    historyList.innerHTML = '<div style="color:#888;">No sessions yet.</div>';
                    return;
                }
                sessions.forEach((s) => {
                    const div = document.createElement('div');
                    div.className = 'history-item' + (s.id === activeSessionId ? ' active-session' : '');
                    div.textContent = s.title;
                    div.onclick = () => { activeSessionId = s.id; saveSessions(); renderChat(); updateHistory(); };
                    historyList.appendChild(div);
                });
            }

            // ---- New Session ----
            newSessionBtn.onclick = () => {
                createSession('New Chat');
                updateHistory();
                renderChat();
                inputBox.focus();
            };

            // ---- Handle Submit ----
            form.onsubmit = async (e) => {
                e.preventDefault();
                errorDiv.textContent = '';
                const input = inputBox.value.trim();
                if (!input) {
                    errorDiv.textContent = 'Please enter some input.';
                    return;
                }
                addBubble(input, true);
                inputBox.value = '';

                try {
                    const res = await fetch('/uselessgpt', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ input })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        addBubble(data.reply, false);
                        const session = getActiveSession();
                        if (session) {
                            session.history.push({ user: input, bot: data.reply });
                            saveSessions();
                            updateHistory();
                        }
                    } else {
                        errorDiv.textContent = data.error || 'Something went wrong.';
                    }
                } catch {
                    errorDiv.textContent = 'Network error.';
                }
            };

            inputBox.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    form.requestSubmit();
                }
            });

            loadSessions();
            if (!sessions.length) createSession('New Chat');
            updateHistory();
            renderChat();
        }

        document.addEventListener('DOMContentLoaded', setupChat);
    </script>
</body>
</html>
